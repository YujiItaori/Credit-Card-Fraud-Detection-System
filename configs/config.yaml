project:
  name: fraud-detection-anomaly-analysis
  random_seed: 42
data:
  raw_file: data/raw/creditcard.csv
  processed_directory: data/processed
  target_column: Class
  feature_columns: &id001
  - Time
  - V1
  - V2
  - V3
  - V4
  - V5
  - V6
  - V7
  - V8
  - V9
  - V10
  - V11
  - V12
  - V13
  - V14
  - V15
  - V16
  - V17
  - V18
  - V19
  - V20
  - V21
  - V22
  - V23
  - V24
  - V25
  - V26
  - V27
  - V28
  - Amount
split:
  train_size: 0.7
  validation_size: 0.15
  test_size: 0.15
  stratify_by_target: true
  remove_exact_duplicates: true
preprocessing:
  supervised_scaled_features: *id001
  anomaly_scaled_features: *id001
